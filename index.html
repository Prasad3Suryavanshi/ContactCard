<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="google" content="notranslate">

<title>Prasad Suryavanshi | Virtual Card</title>

<style>
  :root {
    --page: #eeebe6;
    --surface: #e6e3dd;
    --surface-2: #dcdad4;
    --ink: #22252a;
    --comment: #2f5a63;
    --keyword: #7a3d22;
    --link: #1e4a8a;
    --arrow: #2f7a80;
    --border: #b8b4ac;

    --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  html, body {
    min-height: 100dvh;
    width: 100%;
    background: var(--page);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: clamp(15px, 1.1vw + 12px, 16px);
    line-height: 1.6;
    overflow-x: hidden;
    overflow-wrap: break-word;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(1rem, 4vw, 2rem) clamp(0.75rem, 3vw, 1.5rem);
  }

  a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
  a:hover { color: var(--ink); }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
  }

  .card {
    width: 100%;
    max-width: 500px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .span2 { grid-column: span 2; }

  .hero {
    grid-column: span 2;
    background: var(--surface);
    border: clamp(5px, 1.2vw, 8px) solid var(--comment);
    border-top-width: clamp(16px, 3.5vw, 24px);
    border-radius: 4px;
    padding: clamp(1rem, 3vw, 1.5rem);
  }

  .hero-kicker {
    font-size: 0.75rem;
    font-style: italic;
    font-weight: 600;
    color: var(--comment);
    letter-spacing: 0.03em;
    margin-bottom: 0.75rem;
  }

  .hero-name {
    font-size: clamp(1.8rem, 6vw, 3rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 0.6rem;
  }

  .hero-rule {
    height: 1.5px;
    background: var(--border);
    margin: 0.9rem 0;
  }

  .hero-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  .hero-role {
    font-size: 0.85rem;
    font-style: italic;
    font-weight: 600;
    color: var(--comment);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.25rem 0.6rem;
    border: 1.5px solid var(--arrow);
    border-radius: 3px;
    background: transparent;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--arrow);
    flex-shrink: 0;
  }
  .badge-text {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--arrow);
  }

  .cell {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 0.9rem 1rem;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: inherit;
    text-decoration: none;
    transition: none;
  }

  .cell:hover {
    border-color: var(--ink);
    background: var(--surface-2);
  }

  .ico {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.6rem;
    flex-shrink: 0;
  }
  .ico svg {
    width: 14px;
    height: 14px;
    stroke: var(--ink);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .lbl {
    font-size: 0.7rem;
    font-style: italic;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--comment);
    margin-bottom: 0.25rem;
  }

  .val {
    font-size: 0.85rem;
    color: var(--ink);
    line-height: 1.45;
    word-break: break-all;
  }

  .val-md {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }

  .chip {
    position: absolute;
    top: 0.65rem;
    right: 0.75rem;
    font-size: 0.75rem;
    color: var(--comment);
    font-weight: 600;
  }

  .row-cell {
    display: flex !important;
    flex-direction: row;
    align-items: center;
    gap: 0.8rem;
    padding: 0.75rem 1rem;
  }
  .row-cell .ico { margin-bottom: 0; }
  .row-cell .info { flex: 1; min-width: 0; overflow: hidden; }
  .row-cell .chip { position: static; }

  .save-row {
    grid-column: span 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 0.4rem;
    border: none;
    background: transparent;
  }

  .save-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.65rem 1.25rem;
    border-radius: 4px;
    background: var(--link);
    color: #fff;
    border: 1.5px solid var(--link);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: none;
  }
  .save-btn:hover {
    background: #173a6b;
    border-color: #173a6b;
  }
  .save-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @media (max-width: 460px) {
    body { padding: 1rem; }
    .card { gap: 10px; }
  }
</style>
</head>
<body>

<main class="card" role="main" aria-label="Virtual business card — Prasad Suryavanshi">

  <div class="hero">
    <div class="hero-kicker">// B.Tech CSE · Cybersecurity · JNTUH (MRCET)</div>
    <h1 class="hero-name">Prasad Suryavanshi</h1>
    <div class="hero-rule"></div>
    <div class="hero-meta">
      <span class="hero-role">student &amp; developer</span>
      <div class="badge" aria-label="Status: Open to opportunities">
        <span class="dot"></span>
        <span class="badge-text">open to opportunities</span>
      </div>
    </div>
  </div>

  <a class="cell" id="em-btn" aria-label="Email Prasad" rel="noopener noreferrer">
    <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg></div>
    <div class="lbl">email</div>
    <div class="val" id="em-disp"></div>
    <span class="chip" aria-hidden="true">↗</span>
  </a>

  <a class="cell" id="ph-btn" aria-label="Call Prasad" rel="noopener noreferrer">
    <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 11.5a19.79 19.79 0 01-3.07-8.67A2 2 0 012 .82h3a2 2 0 012 1.72c.18.97.52 1.92.7 2.81a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.9.18 1.84.52 2.81.7A2 2 0 0122 16.92z"/></svg></div>
    <div class="lbl">phone</div>
    <div class="val" id="ph-disp"></div>
    <span class="chip" aria-hidden="true">↗</span>
  </a>

  <a class="cell span2 row-cell" href="https://prasad3suryavanshi.github.io/PortFolio/" target="_blank" rel="noopener noreferrer" aria-label="Portfolio website">
    <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></div>
    <div class="info"><div class="lbl">portfolio</div><div class="val-md">prasad3suryavanshi.github.io</div></div>
    <span class="chip" aria-hidden="true">↗</span>
  </a>

  <a class="cell" href="https://github.com/prasad3suryavanshi" target="_blank" rel="noopener noreferrer" aria-label="GitHub Profile">
    <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg></div>
    <div class="lbl">github</div>
    <div class="val">@Prasad3Suryavanshi</div>
    <span class="chip" aria-hidden="true">↗</span>
  </a>

  <a class="cell" href="https://www.google.com/maps/search/?api=1&query=Hyderabad,Telangana,India" target="_blank" rel="noopener noreferrer" aria-label="Hyderabad on maps">
    <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
    <div class="lbl">location</div>
    <div class="val">Hyderabad,<br>India</div>
    <span class="chip" aria-hidden="true">↗</span>
  </a>

  <div class="save-row">
    <button class="save-btn" onclick="saveContact()" aria-label="Save as .vcf">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
      save contact
    </button>
  </div>

</main>

<script>
const _eX = "cHJhc2Fkc3VyeWF2YW5zaGkuMTEwMzA2QGdtYWlsLmNvbQ==";
const _pX = "KzkxNjI4MTUzMjc2Mw==";

window.addEventListener('DOMContentLoaded', () => {
  const realEmail = atob(_eX);
  const parts = realEmail.split('@');
  const localPart = parts[0].replace(/\./g, ' [dot] ');
  const domain = parts[1].replace(/\./g, ' [dot] ');
  document.getElementById('em-disp').innerHTML = localPart + '<br>[at] ' + domain;
  document.getElementById('em-btn').href = "mailto:" + realEmail;

  const realPhone = atob(_pX);
  document.getElementById('ph-disp').innerHTML = realPhone.substring(0,3) + ' ' + realPhone.substring(3,8) + '<br>' + realPhone.substring(8);
  document.getElementById('ph-btn').href = "tel:" + realPhone;
});

function saveContact() {
  const vCardData = [
    'BEGIN:VCARD',
    'FN:Prasad Suryavanshi',
    'N:Suryavanshi;Prasad;;;',
    'TITLE:Cybersecurity Student & Developer',
    'ORG:JNTUH — B.Tech CSE (Cybersecurity)',
    `EMAIL:${atob(_eX)}`,
    `TEL;TYPE=CELL:${atob(_pX)}`,
    'URL:https://prasad3suryavanshi.github.io/PortFolio/',
    'ADR;TYPE=HOME:;;Hyderabad;Telangana;;;India',
    'END:VCARD'
  ].join('\n');

  const blob = new Blob([vCardData], { type: 'text/vcard' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'prasad-suryavanshi.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
